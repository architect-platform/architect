[versions]
kotlin = "1.9.25"
ksp = "1.9.25-1.0.20"
micronaut = "4.6.1"
shadow = "8.3.5"
ktlint-plugin = "12.1.0"
detekt-plugin = "1.23.7"
pitest-plugin = "1.15.0"
jmh-plugin = "0.7.2"
coroutines = "1.8.1"
jackson = "2.20.0"
junit = "5.10.0"
mockito = "5.7.0"
mockito-kotlin = "5.1.0"
jacoco = "0.8.12"
slf4j = "2.0.13"
json-schema-validator = "1.5.6"
jakarta-inject = "2.0.1"
jmh = "1.37"
archunit = "1.3.0"
architectApiArtifact = "2.1.0"
architectCoreArtifact = "1.6.1"
architectEngineArtifact = "1.6.1"
architectCliArtifact = "1.1.0"
pluginDefaultArtifact = "1.0.0"
pluginDocsArtifact = "2.1.0"
pluginGradleArtifact = "1.1.0"
pluginGithubArtifact = "1.0.3"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut" }
micronaut-aot = { id = "io.micronaut.aot", version.ref = "micronaut" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt-plugin" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh-plugin" }

[libraries]
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
