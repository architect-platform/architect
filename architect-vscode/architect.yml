project:
  name: architect-vscode
  description: "VS Code extension for the Architect platform"

plugins:
  - name: javascript-architected
    repo: architect-platform/architect
  - name: github-architected
    repo: architect-platform/architect
  - name: docs-architected
    repo: architect-platform/architect

javascript:
  packageManager: npm
  workingDirectory: .

github:
  pipelines:
    - name: "ci"
      type: "pipeline"
      branch: "main"
