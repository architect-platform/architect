project:
  name: my-architecture-validated-project
  description: "Example project using architecture-architected plugin"

plugins:
  - name: architecture-architected
    repo: architect-platform/architecture-architected

architecture:
  enabled: true
  onViolation: warn
  reportFormat: text
  strict: false
  rulesets:
    layered:
      enabled: true
      description: "Example layered architecture rules"
      rules:
        - id: no-direct-repository-access
          description: "Controllers should not depend directly on repositories"
          type: dependency
          pattern: ".*Controller.*"
          forbidden:
            - ".*Repository.*"
          severity: error
