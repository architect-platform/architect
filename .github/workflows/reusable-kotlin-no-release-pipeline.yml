# Hand-maintained CI policy: update this file to change build-only behavior
# for modules that do not have a release/publish step (e.g., cloud backend/UI).
# Generated caller workflows are thin wrappers — never edit them directly.
name: Reusable Kotlin Pipeline (build and test only)

on:
  workflow_call:
    inputs:
      module-name:
        description: 'Human-readable pipeline name used in job display names and concurrency keys'
        required: true
        type: string
      working-directory:
        description: 'Path to the module root (relative to repo root) where architect commands run'
        required: true
        type: string

jobs:
  build:
    name: ${{ inputs.module-name }}
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Architect CLI and Engine
        uses: ./.github/actions/setup-architect
        with:
          install-engine: 'true'

      - name: Init
        run: architect init --plain
        working-directory: ${{ inputs.working-directory }}

      - name: Verify
        run: architect verify --plain
        working-directory: ${{ inputs.working-directory }}

      - name: Build
        run: architect build --plain
        working-directory: ${{ inputs.working-directory }}

      - name: Test
        run: architect test --plain
        working-directory: ${{ inputs.working-directory }}
